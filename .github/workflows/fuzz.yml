name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run bgzf_parser -- -max_total_time=60
      - run: cargo fuzz run gzi_parser -- -max_total_time=60
