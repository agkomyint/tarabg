[package]
name = "tarabg"
version = "0.3.0"
edition = "2021"
description = "A clean-room Rust BGZF command-line tool"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
flate2 = "1.1"
libdeflater = "1"
rayon = "1.10"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.12"
